# infrastructure/template.yaml
# AWS SAM template for Kitten Companion Lambda functions and API Gateway.
# RDS and ElastiCache were provisioned manually in Phase 3 — endpoints hardcoded below.

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Kitten Companion — serverless backend (Lambda + API Gateway)

# ------------------------------------------------------------------
# Parameters
# ------------------------------------------------------------------
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment

  LambdaSecurityGroupId:
    Type: String
    Default: sg-0cf3dc6ab090a2ea1

  PrivateSubnet1Id:
    Type: String
    Default: subnet-0008d1ee5301544b3

  PrivateSubnet2Id:
    Type: String
    Default: subnet-032f04d426b7985d2

  # DB/Redis endpoints. Dev defaults to the manually-provisioned instances so
  # `sam deploy` keeps working with no overrides. Prod overrides these with the
  # endpoints from the network stack (resolved via SSM in deploy.sh).
  DbHost:
    Type: String
    Default: kitten-companion-dev.cufeae06m9jz.us-east-1.rds.amazonaws.com
    Description: RDS PostgreSQL endpoint

  RedisHost:
    Type: String
    Default: kitten-companion-dev.vyiyix.0001.use1.cache.amazonaws.com
    Description: ElastiCache Redis endpoint

# ------------------------------------------------------------------
# Global defaults applied to all Lambda functions
# ------------------------------------------------------------------
Globals:
  Function:
    # Java/Spring Boot Lambdas need more memory (= more CPU) and a longer timeout
    # to complete their cold-start Spring context + Hibernate initialization.
    MemorySize: 1024
    Timeout: 60
    VpcConfig:
      SecurityGroupIds:
        - !Ref LambdaSecurityGroupId
      SubnetIds:
        - !Ref PrivateSubnet1Id
        - !Ref PrivateSubnet2Id
    Environment:
      Variables:
        # Database — endpoint comes from the DbHost parameter (dev default or prod
        # override resolved from the network stack via deploy.sh).
        DB_HOST: !Ref DbHost
        DB_PORT: 5432
        DB_NAME: !Sub 'newcat_${Environment}'
        DB_USER: kittenapp
        DB_PASSWORD: !Sub '{{resolve:secretsmanager:kitten-companion/${Environment}/db-credentials:SecretString:password}}'
        # Cache — endpoint comes from the RedisHost parameter.
        REDIS_HOST: !Ref RedisHost
        REDIS_PORT: 6379
        # Auth
        JWT_SECRET: !Sub '{{resolve:secretsmanager:kitten-companion/${Environment}/jwt-secret:SecretString}}'
        # Email
        SENDGRID_API_KEY: !Sub '{{resolve:secretsmanager:kitten-companion/${Environment}/sendgrid-api-key:SecretString:api_key}}'
        SENDGRID_FROM_EMAIL: !Sub '{{resolve:secretsmanager:kitten-companion/${Environment}/sendgrid-api-key:SecretString:from_email}}'
        # SQS Queues
        PATTERN_DETECTION_QUEUE_URL: !Sub 'https://sqs.${AWS::Region}.amazonaws.com/${AWS::AccountId}/kitten-pattern-detection-${Environment}'
        TRIAGE_QUEUE_URL: !Sub 'https://sqs.${AWS::Region}.amazonaws.com/${AWS::AccountId}/kitten-triage-followup-${Environment}'
        ASYNC_LLM_QUEUE_URL: !Sub 'https://sqs.${AWS::Region}.amazonaws.com/${AWS::AccountId}/kitten-async-llm-${Environment}'
        NOTIFICATION_QUEUE_URL: !Sub 'https://sqs.${AWS::Region}.amazonaws.com/${AWS::AccountId}/kitten-notification-${Environment}'
        # App
        AWS_BEDROCK_REGION: us-east-1
        # Claude model used by triage + vet-summary. Change here (no rebuild) to
        # swap models, e.g. us.anthropic.claude-sonnet-4-5-20250929-v1:0 for higher quality.
        BEDROCK_MODEL_ID: us.anthropic.claude-3-haiku-20240307-v1:0
        ENVIRONMENT: !Ref Environment
        LOG_LEVEL: !If [IsProd, warn, info]

# ------------------------------------------------------------------
# Resources
# ------------------------------------------------------------------
Resources:

  # ----------------------------------------------------------------
  # Shared IAM execution role for all Lambda functions
  # Grants: Bedrock (Claude), Secrets Manager, SQS, CloudWatch logs
  # ----------------------------------------------------------------
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'kittencompanion-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AmazonBedrockFullAccess
        - arn:aws:iam::aws:policy/SecretsManagerReadWrite
        - arn:aws:iam::aws:policy/AmazonSQSFullAccess
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess

  # ----------------------------------------------------------------
  # API Gateway
  # ----------------------------------------------------------------
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub 'kittencompanion-api-${Environment}'
      StageName: !Ref Environment
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"

  # ----------------------------------------------------------------
  # Auth Lambda (Node.js)
  # ----------------------------------------------------------------
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'kittencompanion-auth-${Environment}'
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: ../services/auth
      Handler: dist/index.handler
      Runtime: nodejs24.x
      Description: Handles OTP signup, JWT verification, token refresh, and logout
      Events:
        SignupAPI:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /auth/signup
            Method: POST
        LoginAPI:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /auth/login
            Method: POST
        VerifyAPI:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /auth/verify
            Method: POST
        RefreshAPI:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /auth/refresh
            Method: POST
        LogoutAPI:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /auth/logout
            Method: POST

  # ----------------------------------------------------------------
  # User Lambda (Node.js)
  # ----------------------------------------------------------------
  UserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'kittencompanion-user-${Environment}'
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: ../services/user
      Handler: dist/index.handler
      Runtime: nodejs24.x
      Description: Manages user profile CRUD and account deletion flow
      Events:
        GetUserAPI:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /users/{id}
            Method: GET
        UpdateUserAPI:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /users/{id}
            Method: PUT
        DeleteUserAPI:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /users/{id}
            Method: DELETE
        ConfirmDeletionAPI:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /users/{id}/confirm-deletion
            Method: POST

  # ----------------------------------------------------------------
  # Pet Lambda (Java)
  # ----------------------------------------------------------------
  PetFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'kittencompanion-pet-${Environment}'
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: ../services/pet/target/pet-service-0.1.0-SNAPSHOT.jar
      Handler: com.newcat.pet.PetLambda
      Runtime: java21
      Description: Manages pet profile creation, retrieval, and update
      Events:
        CreatePetAPI:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /pets
            Method: POST
        GetUserPetsAPI:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /users/{id}/pets
            Method: GET
        GetPetAPI:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /pets/{id}
            Method: GET
        UpdatePetAPI:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /pets/{id}
            Method: PUT
        DeletePetAPI:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /pets/{id}
            Method: DELETE

  # ----------------------------------------------------------------
  # Check-in Lambda (Java)
  # ----------------------------------------------------------------
  CheckinFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'kittencompanion-checkin-${Environment}'
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: ../services/checkin/target/checkin-service-0.1.0-SNAPSHOT.jar
      Handler: com.newcat.checkin.CheckinLambda
      Runtime: java21
      Description: Handles daily check-in submission and history retrieval
      Events:
        CreateCheckinAPI:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /checkins
            Method: POST
        GetCheckinHistoryAPI:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /pets/{id}/checkins
            Method: GET

  # ----------------------------------------------------------------
  # Triage Lambda (Java)
  # ----------------------------------------------------------------
  TriageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'kittencompanion-triage-${Environment}'
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: ../services/triage/target/triage-service-0.1.0-SNAPSHOT.jar
      Handler: com.newcat.triage.TriageLambda
      Runtime: java21
      Description: Triages acute concerns using rule-based logic and Claude via Bedrock
      Events:
        FlagConcernAPI:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /concerns
            Method: POST
        GetConcernAPI:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /concerns/{id}
            Method: GET
        ResolveConcernAPI:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /concerns/{id}/resolve
            Method: POST

  # ----------------------------------------------------------------
  # Pattern Detection Lambda (Java) — triggered by SQS
  # ----------------------------------------------------------------
  PatternDetectionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'kittencompanion-pattern-detection-${Environment}'
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: ../services/pattern-detection/target/pattern-detection-service-0.1.0-SNAPSHOT.jar
      Handler: com.newcat.pattern.PatternDetectionLambda
      Runtime: java21
      Description: Analyzes weekly check-in patterns and generates behavioral digests
      Events:
        SQSTrigger:
          Type: SQS
          Properties:
            Queue: !Sub 'arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:kitten-pattern-detection-${Environment}'
            BatchSize: 10

  # ----------------------------------------------------------------
  # Vet Summary Lambda (Java)
  # ----------------------------------------------------------------
  VetSummaryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'kittencompanion-vet-summary-${Environment}'
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: ../services/vet-summary/target/vet-summary-service-0.1.0-SNAPSHOT.jar
      Handler: com.newcat.vetsummary.VetSummaryLambda
      Runtime: java21
      Description: Generates HTML/text vet summary reports using Claude via Bedrock
      Events:
        GetSummaryAPI:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /pets/{id}/summaries
            Method: GET
        GenerateSummaryAPI:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /pets/{id}/summaries
            Method: POST

  # ----------------------------------------------------------------
  # Notification Lambda (Node.js) — triggered by SQS
  # ----------------------------------------------------------------
  NotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'kittencompanion-notification-${Environment}'
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: ../services/notification
      Handler: dist/index.handler
      Runtime: nodejs24.x
      Description: Sends reminder emails and digest notifications via SendGrid
      Events:
        SQSTrigger:
          Type: SQS
          Properties:
            Queue: !Sub 'arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:kitten-notification-${Environment}'
            BatchSize: 10

# ------------------------------------------------------------------
# Conditions
# ------------------------------------------------------------------
Conditions:
  IsProd: !Equals [!Ref Environment, prod]

# ------------------------------------------------------------------
# Outputs
# ------------------------------------------------------------------
Outputs:
  ApiEndpoint:
    Description: API Gateway base URL — set this as NEXT_PUBLIC_API_URL in Vercel
    Value: !Sub 'https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
  AuthFunctionArn:
    Value: !GetAtt AuthFunction.Arn
  UserFunctionArn:
    Value: !GetAtt UserFunction.Arn
  PetFunctionArn:
    Value: !GetAtt PetFunction.Arn
  CheckinFunctionArn:
    Value: !GetAtt CheckinFunction.Arn
  TriageFunctionArn:
    Value: !GetAtt TriageFunction.Arn
  VetSummaryFunctionArn:
    Value: !GetAtt VetSummaryFunction.Arn
  PatternDetectionFunctionArn:
    Value: !GetAtt PatternDetectionFunction.Arn
  NotificationFunctionArn:
    Value: !GetAtt NotificationFunction.Arn
