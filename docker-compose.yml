# docker-compose.yml
# Defines the local development environment for Kitten Companion.
# Starts PostgreSQL 15, Redis 7, and LocalStack services with health checks.
# See TDD Section 8.1 for full local setup documentation.

version: '3.8'

services:
  # ------------------------------------------------------------------
  # PostgreSQL 15 — primary relational database
  # TDD Section 1.1
  # ------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: kittencompanion-postgres
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: newcat_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # TODO: mount migration init script once database/migrations exist
      # - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d newcat_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Redis 7 — caching & JWT blocklist
  # TDD Section 5.1
  # ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: kittencompanion-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ------------------------------------------------------------------
  # LocalStack — emulates AWS services locally (Lambda, SQS, EventBridge)
  # TDD Section 8.1, 9.1
  # ------------------------------------------------------------------
  localstack:
    image: localstack/localstack:latest
    container_name: kittencompanion-localstack
    environment:
      # Services to emulate — add as needed
      SERVICES: lambda,sqs,sns,events,cloudwatch,logs,secretsmanager
      DEBUG: 1
      DOCKER_HOST: unix:///var/run/docker.sock
      # Default region
      DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      # TODO: mount LocalStack init script when infrastructure/localstack-init.sh exists
      # - "./infrastructure/scripts/localstack-init.sh:/docker-entrypoint-initdb.d/init-aws.sh"
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

# ------------------------------------------------------------------
# Named volumes for persistence between restarts
# ------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  localstack_data:
    driver: local
