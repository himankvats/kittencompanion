# application.properties — Vet Summary Service
# See TDD Section 5.1 for connection pool spec, Section 4.4 for Bedrock config.

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:newcat_dev}
spring.datasource.username=${DB_USER:devuser}
spring.datasource.password=${DB_PASSWORD:devpassword}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

aws.bedrock.region=${AWS_BEDROCK_REGION:us-east-1}
aws.region=${AWS_REGION:us-east-1}

server.port=8083
logging.level.root=${LOG_LEVEL:debug}
spring.application.name=vet-summary-service
