# application.properties — Check-in Service
# See TDD Section 5.1 for connection pool spec, Section 8.2 for variable names.

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:newcat_dev}?stringtype=unspecified
spring.datasource.username=${DB_USER:devuser}
spring.datasource.password=${DB_PASSWORD:devpassword}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# SQS endpoint (LocalStack for dev) — TDD Section 8.1
aws.sqs.endpoint=${LOCALSTACK_ENDPOINT:}
aws.region=${AWS_REGION:us-east-1}

server.port=8081
logging.level.root=${LOG_LEVEL:debug}
spring.application.name=checkin-service
