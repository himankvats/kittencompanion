# application.properties — Pet Service
# All sensitive values must be injected as environment variables.
# See TDD Section 5.1 for connection pool specification and Section 8.2 for variable names.

# ------------------------------------------------------------------
# DataSource (PostgreSQL 15)
# TDD Section 1.1, 5.1
# ------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:newcat_dev}
spring.datasource.username=${DB_USER:devuser}
spring.datasource.password=${DB_PASSWORD:devpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool settings (TDD Section 5.1)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.auto-commit=true

# ------------------------------------------------------------------
# JPA / Hibernate
# ------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ------------------------------------------------------------------
# Redis (ElastiCache)
# TDD Section 5.1
# ------------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=5000

# ------------------------------------------------------------------
# Application settings
# ------------------------------------------------------------------
server.port=8080
logging.level.root=${LOG_LEVEL:debug}
spring.application.name=pet-service
